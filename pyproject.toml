[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phishingan"
version = "0.1.0"
description = "Explainable detection of AI-generated phishing emails and messages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["phishing", "security", "browser-extension", "machine-learning", "explainable-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Daemon-018/phishingan"
Repository = "https://github.com/Daemon-018/phishingan"
Issues = "https://github.com/Daemon-018/phishingan/issues"

[project.scripts]
phishingan = "phishingan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishingan = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
